name: Build patched RisingWave

on:
  workflow_dispatch:

concurrency:
  group: whop-build

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  GH_TOKEN: ${{ github.token }}

jobs:
  assemble:
    if: github.actor == 'jjantschulev'
    runs-on: ubuntu-latest
    environment: build
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Apply the patches to the base release
        run: |
          git clone --quiet --depth 1 --branch "$GITHUB_REF_NAME" "https://github.com/$GITHUB_REPOSITORY" tooling
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tooling/assemble build | tee patches.txt
          { echo '```'; cat patches.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Tag the patched tree
        id: tag
        working-directory: build
        env:
          BUILD_DEPLOY_KEY: ${{ secrets.BUILD_DEPLOY_KEY }}
        run: |
          base=$(awk '$1 == "base" { print $2 }' ../tooling/patches)
          last=$(git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/$base-whop.*" | sed -E 's/.*-whop\.([0-9]+)$/\1/' | sort -n | tail -1)
          tag="$base-whop.$(( ${last:-0} + 1 ))"
          git tag -a "$tag" -F ../patches.txt
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/build_key
          printf '%s\n' "$BUILD_DEPLOY_KEY" > ~/.ssh/build_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/build_key -o IdentitiesOnly=yes" git push --quiet "git@github.com:$GITHUB_REPOSITORY.git" "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: assemble
    runs-on: blacksmith-32vcpu-ubuntu-2404-arm
    timeout-minutes: 360
    outputs:
      image: ${{ steps.push.outputs.image }}
    env:
      TAG: ${{ needs.assemble.outputs.tag }}
    steps:
      - name: Check out the patched tree
        run: git clone --quiet --depth 1 --branch "$TAG" "https://github.com/$GITHUB_REPOSITORY" risingwave
      - name: Build the image as upstream's ci/scripts/docker.sh does
        working-directory: risingwave
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --name container --driver=docker-container
          docker buildx build -f docker/Dockerfile \
            --build-arg "GIT_SHA=$(git rev-parse HEAD)" \
            --build-arg "CARGO_PROFILE=production" \
            -t "$IMAGE:$TAG" \
            --progress plain \
            --builder=container \
            --load \
            --cache-to "type=registry,ref=$IMAGE-build-cache:aarch64" \
            --cache-from "type=registry,ref=$IMAGE-build-cache:aarch64" \
            .
      - name: Check the image starts
        run: |
          container_id=$(docker run -d "$IMAGE:$TAG" playground)
          sleep 10
          if [ "$(docker inspect --format='{{.State.Status}}' "$container_id")" != "running" ]; then
            docker logs "$container_id"
            exit 1
          fi
          docker rm -f "$container_id"
      - name: Run the checks of the patches
        run: |
          git clone --quiet "https://github.com/$GITHUB_REPOSITORY" tooling
          git -C tooling checkout --quiet "$GITHUB_SHA"
          pipx install --quiet uv
          tooling/check "$IMAGE:$TAG"
      - name: Push
        id: push
        run: |
          docker push "$IMAGE:$TAG"
          echo "image=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$TAG")" >> "$GITHUB_OUTPUT"

  release:
    needs: [assemble, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish a release with the patch list
        env:
          TAG: ${{ needs.assemble.outputs.tag }}
          PINNED_IMAGE: ${{ needs.build.outputs.image }}
        run: |
          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" --jq .object.sha)
          patches=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq .message)
          notes=$(printf 'Image: `%s`\n\n```\n%s\n```\n' "$PINNED_IMAGE" "$patches")
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "$notes" --verify-tag
